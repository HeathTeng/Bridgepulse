<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bridgepulse</title>
  <link rel="stylesheet" href="/widget.css">
  <link rel="stylesheet" href="/guide.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="bar">
      <div class="brand">
        <span class="brand-mark"><b id="brand-name"></b><i id="brand-en"></i></span>
        <span id="sync-time" class="muted">读取中…</span>
      </div>
      <div class="ctrl">
        <button id="btn-help" title="帮助" aria-label="帮助">💡</button>
        <button id="btn-setup" title="设置" aria-label="设置">⚙</button>
        <button id="btn-sync" title="同步最新数据"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.6h-2.6"/></svg></button>
        <button id="btn-alpha" title="调整透明度"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" class="fill"/></svg></button>
        <button id="btn-pin" title="窗口置顶" class="desk-only"><svg viewBox="0 0 16 16"><path d="M5.5 2.5h5M6.5 2.5v4l-2 2.5h7l-2-2.5v-4M8 9v4.5"/></svg></button>
        <button id="btn-hide" title="隐藏成小图标" class="desk-only"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M5.2 6.6l1.3 3.4 1.5-2.6 1.5 2.6 1.3-3.4"/></svg></button>
        <button id="btn-fold" title="收起 / 展开"><svg viewBox="0 0 16 16"><path d="M4 6.5l4 4 4-4"/></svg></button>
        <button id="btn-close" title="关闭" class="desk-only"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button>
      </div>
    </header>

    <div id="alpha-pop" class="alpha-pop" hidden>
      <span>背景透明度</span>
      <input id="alpha" type="range" min="0.3" max="0.95" step="0.05">
      <label class="opaque-switch"><input id="opaque" type="checkbox">不透明</label>
    </div>

    <nav class="daynav" id="daynav" hidden>
      <button id="day-prev" title="前一天">‹</button>
      <span id="day-name">今天</span>
      <button id="day-next" title="后一天">›</button>
    </nav>
    <section class="rings" id="rings"></section>

    <div id="body">
      <nav class="tabs" id="tabs">
        <button data-tab="today" class="on">今日</button>
        <button data-tab="sleep">睡眠</button>
        <button data-tab="recovery">恢复</button>
        <button data-tab="strain">负荷</button>
        <button data-tab="health">健康</button>
        <button data-tab="week">周报</button>
        <button data-tab="dict">词典</button>
      </nav>
      <main class="pane" id="pane"></main>
    </div>
  </div>

  <!-- 隐藏后的小图标：深色圆底、细线 W、外圈颜色跟今天的恢复度（手画，不是 WHOOP 的标志） -->
  <div id="hide-icon" class="hide-icon" hidden title="点一下恢复，按住可以拖动">
    <svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" class="base"/><circle cx="28" cy="28" r="25" class="ring" id="hide-ring"/><path d="M16.5 21.5l5 13.5 6.5-11 6.5 11 5-13.5" class="w"/></svg>
  </div>
  <script src="/brand.js"></script>
  <script src="/sports-zh.js"></script>
  <script src="/core.js"></script>
  <script src="/guide.js"></script>
  <script src="/guide-ui.js"></script>
  <script src="/setup.js"></script>
  <script src="/widget.js"></script>
</body>
</html>
